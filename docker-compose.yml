services:
  # PostgreSQL Database
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: spore-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spore_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Lambda Server - Mainnet
  lambda-mainnet:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUST_IMAGE: ${RUST_IMAGE:-rust:1.85-slim}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-debian:bookworm-slim}
    container_name: lambda-mainnet
    depends_on:
      db:
        condition: service_healthy
    restart: always
    volumes:
      - ./config/default.toml:/app/config/default.toml
    environment:
      - LAMBDA_NEXT__DATABASE__URL=postgres://postgres:postgres@db:5432/spore_db
    command: ["./lambda_next"]

  # Lambda Server - Testnet
  lambda-testnet:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUST_IMAGE: ${RUST_IMAGE:-rust:1.85-slim}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-debian:bookworm-slim}
    container_name: lambda-testnet
    depends_on:
      db:
        condition: service_healthy
    restart: always
    volumes:
      - ./config/testnet.toml:/app/config/default.toml
    environment:
      - LAMBDA_NEXT__DATABASE__URL=postgres://postgres:postgres@db:5432/spore_db
    command: ["./lambda_next", "--config", "config/testnet.toml"]

  # Spore API Server
  spore-api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        RUST_IMAGE: ${RUST_IMAGE:-rust:1.85-slim}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-debian:bookworm-slim}
    container_name: spore-api-server
    depends_on:
      db:
        condition: service_healthy
    restart: always
    ports:
      - "3002:3000"
    volumes:
      - ./config:/app/config
    environment:
      - LAMBDA_NEXT__DATABASE__URL=postgres://postgres:postgres@db:5432/spore_db

volumes:
  postgres_data:
    name: "lambda"
