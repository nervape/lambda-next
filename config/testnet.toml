[rpc]
urls = [
    "https://testnet.ckb.dev/",
    "https://testnet.ckbapp.dev/"
]
connect_timeout_secs = 5
request_timeout_secs = 30
max_retries = 2
retry_interval_millis = 1000

[ckb]
type_script_code_hash = "0x685a60219309029d01310311dba953d67029170ca4848a4ff638e57002130a0d"
type_script_hash_type = "data1"
query_limit = 300
query_interval_secs = 60
network_type = "testnet"
sync_start_block = 10222279
confirmations = 12
overlap_blocks = 24
block_batch_size = 100000

[database]
enabled = true
url = "postgres://postgres:postgres@db:5432/spore_db"
max_connections = 5

[dob_decoder]
enabled = true
url = "https://dev-api.nervape.com/decoder"
batch_size = 50

