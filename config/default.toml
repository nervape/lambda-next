[rpc]
urls = [
    "https://mainnet.ckbapp.dev/",
    "https://mainnet.ckb.dev/",
]
connect_timeout_secs = 5
request_timeout_secs = 30
max_retries = 2
retry_interval_millis = 1000

[ckb]
type_script_code_hash = "0x4a4dce1df3dffff7f8b2cd7dff7303df3b6150c9788cb75dcf6747247132b9f5"
type_script_hash_type = "data1"
query_limit = 300
query_interval_secs = 60
network_type = "mainnet"
sync_start_block = 0
confirmations = 12
overlap_blocks = 24
block_batch_size = 100000

[database]
enabled = true
url = "postgres://postgres:postgres@db:5432/spore_db"
max_connections = 5

[dob_decoder]
enabled = true
url = "https://api.nervape.com/decoder"
batch_size = 50

